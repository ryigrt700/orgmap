<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خريطة المسارات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: أداة عمل هادئة، كل شيء على الرسمة
   IDEA: خريطة مترو / لوحة دائرة إلكترونية للمؤسسة
   PICTURE: الخريطة الثلاثية تملأ الشاشة، والتحرير يظهر فوق المحطة نفسها
   COLOUR and TYPE: أرضية بيضاء، حبر داكن، ألوان خطوط المترو للإدارات؛ IBM Plex Sans Arabic
   LAYOUT: شريط علوي رفيع، ثم الرسمة بعرض الشاشة كاملة */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1214);--ink:light-dark(#15181b,#e8eaec);--muted:light-dark(#5d646b,#9aa2a9);--line:light-dark(#e2e5e8,#2a3035);--stage:light-dark(#fafbfb,#12161a);--node:light-dark(#ffffff,#0f1214);--danger:light-dark(#c0392b,#f08070);--accent:light-dark(#0f6e56,#5dcaa5);--pop:light-dark(#ffffff,#1c2125)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px max(3vw,14px);border-bottom:1px solid var(--line)}
h1{font-size:clamp(20px,2.6vw,28px);line-height:1.1;margin:0;font-weight:600;flex:1 1 180px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
button,select,input{font:inherit;font-size:15px;min-height:38px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{cursor:pointer}button:hover{border-color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);color:var(--bg);border-color:var(--accent)}
#status{font-size:13px;color:var(--muted)}
.fig{position:relative;height:max(500px,calc(100vh - 64px));background:var(--stage);touch-action:none;cursor:grab;overflow:hidden}
.fig>canvas{position:absolute;inset:0;width:100%;height:100%}
.hint{position:absolute;bottom:10px;inset-inline-start:12px;inset-inline-end:12px;font-size:13px;color:var(--muted);pointer-events:none}
.legend{position:absolute;top:10px;inset-inline-start:12px;display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);pointer-events:none}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid currentColor;vertical-align:-1px;margin-inline-end:4px}
.tb{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);display:none;flex-direction:column;gap:6px;padding:8px;background:var(--pop);border:1px solid var(--line);border-radius:12px;cursor:default;width:max-content;max-width:calc(100% - 24px)}
.tb .r{justify-content:center}
.tb .p{font-size:13px;color:var(--muted);line-height:1.4}
.tb .code{font-family:ui-monospace,monospace;direction:ltr;unicode-bidi:embed;color:var(--accent)}
.tb .r{display:flex;flex-wrap:wrap;gap:6px}
.tb button,.tb select,.tb input{min-height:34px;font-size:14px;padding:2px 8px;border-radius:8px}
.tb .del{color:var(--danger)}
.tb input[type=date]{direction:ltr;text-align:right}
#tbDate.empty::-webkit-datetime-edit{opacity:0}
.tb .dl{font-size:13px;color:var(--muted);align-self:center}
.shp[hidden],.sw[hidden]{display:none}
.tog button{display:inline-flex;align-items:center;gap:6px}.tog button[aria-expanded=true]{border-color:var(--ink)}
.tog .dt{width:14px;height:14px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
.shp button{min-width:44px;font-size:14px}.shp button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.sw{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center}
.sw button{width:26px;height:26px;min-height:26px;padding:0;border-radius:50%;border:2px solid var(--pop);outline:1px solid var(--line)}
.sw button[aria-pressed=true]{outline:2px solid var(--ink)}
.sw .auto{width:auto;border-radius:13px;padding:0 8px;font-size:12px;background:var(--pop);border:1px solid var(--line);outline:0}
.sw input[type=color]{width:26px;height:26px;min-height:26px;padding:0;border:1px solid var(--line);border-radius:50%;background:none;cursor:pointer}
.ctl{position:absolute;top:44px;inset-inline-end:12px;display:grid;grid-template-columns:repeat(3,36px);gap:4px;padding:6px;background:var(--pop);border:1px solid var(--line);border-radius:12px;cursor:default;user-select:none}
.ctl button{min-height:36px;height:36px;padding:0;font-size:17px;line-height:1;border-radius:8px;touch-action:none}
.ctl .lab{grid-column:1/-1;font-size:11px;color:var(--muted);text-align:center;margin-top:2px}
#nameEd{position:absolute;top:0;left:0;display:none;width:200px;font-size:16px;font-weight:500;padding:4px 10px;border:2px solid var(--accent);background:var(--pop);border-radius:8px}
details{padding:12px max(3vw,14px)}details summary{cursor:pointer;font-size:14px;color:var(--muted)}
details textarea{width:100%;margin-top:8px;font:13px ui-monospace,monospace;direction:ltr;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
@media(max-width:600px){header{gap:8px}.seg button{padding:4px 8px;font-size:14px}.fig{height:max(460px,calc(100vh - 120px))}}
</style>
</head>

<span></span><button type="button" data-act="rd" aria-label="إمالة لأسفل" title="إمالة لأسفل">⤓</button><span></span>
</div>
<div class="tb" id="tb">
<div class="p" id="tbPath"></div>
<div class="r">
<button type="button" id="tbName">الاسم</button>
<select id="tbType" aria-label="النوع"><option>إدارة</option><option>قسم</option><option>موظف</option><option>مهمة</option><option>خطوة</option></select>
<select id="tbStat" aria-label="الحالة"><option>جديدة</option><option>قيد التنفيذ</option><option>مكتملة</option></select>
</div>
<div class="r">
<span class="dl">التاريخ</span><input type="date" id="tbDate" lang="en" aria-label="التاريخ">
<button type="button" id="tbUp" aria-label="تقديم">↑</button>
<button type="button" id="tbDn" aria-label="تأخير">↓</button>

</div>
<div class="r tog"><button type="button" id="shpT" aria-expanded="false" aria-controls="shp"><span id="shpI">●</span> الشكل ▾</button><button type="button" id="swT" aria-expanded="false" aria-controls="sw"><span class="dt" id="swI"></span> اللون ▾</button></div>
<div class="r shp" id="shp" aria-label="الشكل" hidden><button type="button" data-s="circle">● دائرة</button><button type="button" data-s="square">■ مربع</button><button type="button" data-s="diamond">◆ معين</button></div>

</div>

</div>

<textarea id="json" rows="6"></textarea>
<div style="display:flex;gap:8px;margin-top:8px"><button type="button" id="cp">نسخ</button><button type="button" id="imp">استيراد من النص</button></div>
</details>
<script>try{var x=new XMLHttpRequest();x.open('GET','%D8%A7%D9%84%D8%A5%D8%AF%D8%A7%D8%B1%D8%A9%20%D8%A7%D9%84%D9%85%D8%A7%D9%84%D9%8A%D8%A9%202026-11-26.json?t'+'='+Date.now(),false);x.send();if(x.status==200){var t=x.responseText,d=JSON.parse(t);if(d&&d.nodes&&localStorage.getItem('orgmap-src')!==t){localStorage.setItem('orgmap-data',t);localStorage.setItem('orgmap-src',t);}}}catch(e){}</script>
<script type="application/json" id="state">{"nodes":[{"id":"r","parent":null,"name":"اكتب العنوان هنا","type":"إدارة"}]}</script>
<script>
{
const $=id=>document.getElementById(id);
const COLORS=['#0f8a6c','#6a4fc8','#d4572a','#c23d72','#b7791f','#2c6fbf','#4d8a1f','#7a6a55'];
const AUTO=['down','left','down','back','down','left','front'];
const V={down:[0,-1,0],up:[0,1,0],left:[-1,0,0],right:[1,0,0],front:[0,0,-1],back:[0,0,1]};
const DN={down:'أسفل',up:'أعلى',left:'يسار',right:'يمين',front:'أمام',back:'خلف'};
const U=1.4,LG=3.2;
let S=JSON.parse($('state').textContent);
let dirty=false,hist=[],mode='normal',sel=null,rx=-0.3,ry=0.55,zoom=1,pan=[0,0],drag=null,T={},list=[],art=null,handles=[],hover=null,editing=null,delArm=0;
const SEED=JSON.stringify(S);let canStore=true;
try{const d=JSON.parse(localStorage.getItem('orgmap-data')||'null');if(d&&Array.isArray(d.nodes)&&d.nodes.some(n=>n.parent===null))S=d;}catch(e){canStore=false;}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const css=v=>{let p=document.getElementById('cprobe');if(!p){p=document.createElement('span');p.id='cprobe';p.hidden=true;document.body.appendChild(p);}p.style.color='var('+v+')';return getComputedStyle(p).color||'#888';};
const rootNode=()=>S.nodes.find(n=>n.parent===null);
function buildTree(){
  T={};S.nodes.forEach(n=>T[n.id]={n,ch:[],par:null,depth:0});
  S.nodes.forEach(n=>{if(n.parent&&T[n.parent]){T[n.id].par=T[n.parent];T[n.parent].ch.push(T[n.id]);}});
  list=[];(function walk(t,d,color,code){t.depth=d;t.color=t.n.color||color;t.code=code;list.push(t);
    t.ch.forEach((c,i)=>walk(c,d+1,d===0&&!t.n.color?COLORS[i%COLORS.length]:t.color,code+(code?'.':'')+i.toString(2)));})(T[rootNode().id],0,null,'');
}
const OPP={down:'up',up:'down',left:'right',right:'left',front:'back',back:'front'};
function sideOf(c){const p=c.par;let d=c.n.side||(p.n.dir&&p.n.dir!=='auto'?p.n.dir:AUTO[p.depth%AUTO.length]);
  if(mode!=='normal'&&(d==='front'||d==='back'))d=p.depth%2?'left':'down';
  if(p.par&&!(mode==='layers'&&p.depth===1)){const inc=sideOf(p);if(d===OPP[inc])d=inc==='down'||inc==='up'?'left':'down';}
  return d;}
function groups(t){const g={};t.ch.forEach(c=>{const s=sideOf(c);(g[s]=g[s]||[]).push(c);});return g;}
const H0=0.32*U,TH=0.05*U;
const shift=(b,o)=>[b[0]+o[0],b[1]+o[1],b[2]+o[2],b[3]+o[0],b[4]+o[1],b[5]+o[2]];
const ov=(a,b)=>a[0]<b[3]&&b[0]<a[3]&&a[1]<b[4]&&b[1]<a[4]&&a[2]<b[5]&&b[2]<a[5];
function bbox(A){const r=[1e9,1e9,1e9,-1e9,-1e9,-1e9];A.forEach(b=>{for(let k=0;k<3;k++){r[k]=Math.min(r[k],b[k]);r[k+3]=Math.max(r[k+3],b[k+3]);}});return r;}
function hit(A,B){const ba=bbox(A);const C=B.filter(b=>ov(b,ba));if(!C.length)return false;return A.some(a=>C.some(b=>ov(a,b)));}
function segBox(d,a,b){const lo=[-TH,-TH,-TH],hi=[TH,TH,TH];for(let k=0;k<3;k++)if(d[k]){const x=d[k]*a,y=d[k]*b;lo[k]=Math.min(x,y);hi[k]=Math.max(x,y);}return[...lo,...hi];}
function lay(t){
  const lw=(t.n.name||'..').length*0.085*U+0.25*U;
  const prims=[[-H0,-H0,-H0,H0,H0,H0],[-H0-lw,0.02*U,-0.12*U,-0.02*U,0.62*U,0.12*U]];
  Object.entries(groups(t)).forEach(([k,a])=>{const d=V[k];let last=0;
    a.forEach((c,i)=>{c.prev=i?a[i-1]:t;const cp=lay(c);let s,mv,sg,okk=false;
      const at=(x,strict)=>{const o=[d[0]*x,d[1]*x,d[2]*x];mv=cp.map(b=>shift(b,o));sg=segBox(d,last+H0,x-H0);return!hit(mv,prims)&&(!strict||(!hit([sg],prims)&&!hit([sg],mv)));};
      for(s=last+U;s<last+30*U;s+=U/2)if(at(s,true)){okk=true;break;}
      if(!okk)for(s=last+U;s<last+400*U;s+=U/2)if(at(s,false))break;
      c.rel=[d[0]*s,d[1]*s,d[2]*s];prims.push(...mv,sg);last=s;});});
  return prims;}
function assign(t,p){t.p=p;t.ch.forEach(c=>assign(c,[p[0]+c.rel[0],p[1]+c.rel[1],p[2]+c.rel[2]]));}
const ms=s=>{const t=Date.parse(s);return isNaN(t)?null:t;};
let tr=null,norm=null,SZ=2.5;
function layout(){
  buildTree();const r=list[0];
  r.prev=null;
  if(mode==='layers'){r.p=[0,U,0];r.ch.forEach((c,i)=>{c.prev=i?r.ch[i-1]:r;lay(c);assign(c,[0,0,i*LG]);});}
  else{lay(r);assign(r,[0,0,0]);}
  tr=null;
  if(mode==='time'){
    const ts=list.map(t=>ms(t.n.date)).filter(x=>x!==null);
    let mn=[1e9,1e9],mx=[-1e9,-1e9];list.forEach(t=>{for(let k=0;k<2;k++){mn[k]=Math.min(mn[k],t.p[k]);mx[k]=Math.max(mx[k],t.p[k]);}});
    const TZ=Math.max(mx[0]-mn[0],mx[1]-mn[1],4)*0.9;
    if(ts.length){const a=Math.min(...ts),b=Math.max(...ts),mid=(a+b)/2,rg=(b-a)||1;const zf=x=>-(x-mid)/rg*TZ;
      tr={a,b,zf,x:mn[0]-U,y:mn[1]-U*0.6};list.forEach(t=>{const x=ms(t.n.date);t.p[2]=x!==null?zf(x):(t.par?t.par.p[2]:0);});}
  }
  let mn=[1e9,1e9,1e9],mx=[-1e9,-1e9,-1e9];
  list.forEach(t=>{for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],t.p[k]);mx[k]=Math.max(mx[k],t.p[k]);}});
  const c=mn.map((v,k)=>(v+mx[k])/2),sz=Math.max(mx[0]-mn[0],mx[1]-mn[1],mx[2]-mn[2],2.5);
  SZ=sz;norm=p=>p.map((v,k)=>(v-c[k])/sz*2);list.forEach(t=>t.w=norm(t.p));
}
const cv=$('cv'),ctx=cv.getContext('2d'),fig=$('fig');
function proj(w,Wd,H){let[x,y,z]=w;const cy=Math.cos(ry),sy=Math.sin(ry);[x,z]=[x*cy+z*sy,-x*sy+z*cy];const cx=Math.cos(rx),sx=Math.sin(rx);[y,z]=[y*cx-z*sx,y*sx+z*cx];const f=3.4/(3.4+z),s=Math.min(Wd,H)*0.4*zoom;return[Wd/2+pan[0]+x*s*f,H/2+pan[1]-y*s*f,z,f];}
const isUnder=(t,anc)=>{let s=t;while(s){if(s===anc)return true;s=s.par;}return false;};
const lit=t=>!sel||!T[sel]||isUnder(T[sel],t)||isUnder(t,T[sel]);
const today=Date.now();
function draw(){
  const dpr=window.devicePixelRatio||1,Wd=cv.clientWidth,H=cv.clientHeight;
  if(cv.width!==Math.round(Wd*dpr)||cv.height!==Math.round(H*dpr)){cv.width=Math.round(Wd*dpr);cv.height=Math.round(H*dpr);}
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,Wd,H);if(!list.length)return;
  const ink=css('--ink'),muted=css('--muted'),nodeBg=css('--node'),danger=css('--danger'),pop=css('--pop');
  list.forEach(t=>t.s=proj(t.w,Wd,H));
  ctx.direction='rtl';ctx.lineCap='round';ctx.lineJoin='round';
  if(mode==='layers'){
    list[0].ch.map(d=>{const sub=[];(function g(t){sub.push(t);t.ch.forEach(g);})(d);
      let a=[1e9,1e9],b=[-1e9,-1e9];sub.forEach(t=>{a[0]=Math.min(a[0],t.w[0]);a[1]=Math.min(a[1],t.w[1]);b[0]=Math.max(b[0],t.w[0]);b[1]=Math.max(b[1],t.w[1]);});
      const pd=0.12,z=d.w[2],cs=[[a[0]-pd,a[1]-pd],[b[0]+pd,a[1]-pd],[b[0]+pd,b[1]+pd],[a[0]-pd,b[1]+pd]].map(q=>proj([q[0],q[1],z],Wd,H));
      return{d,cs,z:cs[0][2]};}).sort((p,q)=>q.z-p.z).forEach(p=>{
      ctx.beginPath();p.cs.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();
      ctx.globalAlpha=lit(p.d)?0.09:0.03;ctx.fillStyle=p.d.color;ctx.fill();ctx.globalAlpha=0.35;ctx.strokeStyle=p.d.color;ctx.lineWidth=1;ctx.stroke();ctx.globalAlpha=1;
      ctx.fillStyle=p.d.color;ctx.font='500 12px "IBM Plex Sans Arabic",sans-serif';ctx.textAlign='left';ctx.fillText('طبقة: '+p.d.n.name,p.cs[1][0]+4,p.cs[1][1]+14);});
  }
  if(tr){const za=norm([0,0,tr.zf(tr.a)])[2],zb=norm([0,0,tr.zf(tr.b)])[2],b0=norm([tr.x,tr.y,0]);
    const A=proj([b0[0],b0[1],za],Wd,H),B=proj([b0[0],b0[1],zb],Wd,H);
    ctx.strokeStyle=muted;ctx.lineWidth=1.5;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(A[0],A[1]);ctx.lineTo(B[0],B[1]);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=muted;ctx.font='12px "IBM Plex Sans Arabic",sans-serif';ctx.textAlign='center';

}
function vrLabel(txt,big){const fs=big?60:46,c=document.createElement('canvas'),x=c.getContext('2d'),font=(big?'600 ':'500 ')+fs+'px '+FF;x.font=font;

function buildVR(){
  const M=VR.map;[...M.children].forEach(o=>{M.remove(o);o.traverse(x=>{if(x.material){if(x.material.map)x.material.map.dispose();x.material.dispose();}});});
  VR.picks=[];VR.bills=[];VR.hover=null;const K=0.05*SZ;list.forEach(t=>t.v=new THREE.Vector3(t.w[0]*K,t.w[1]*K,t.w[2]*K));{const o=list[0].v.clone().sub(new THREE.Vector3(0.5,0.2,0));list.forEach(t=>t.v.sub(o));}
  if(mode==='layers')list[0].ch.forEach(d=>{const sub=[];(function g(t){sub.push(t);t.ch.forEach(g);})(d);
    let a=[1e9,1e9],b=[-1e9,-1e9];sub.forEach(t=>{a[0]=Math.min(a[0],t.v.x);a[1]=Math.min(a[1],t.v.y);b[0]=Math.max(b[0],t.v.x);b[1]=Math.max(b[1],t.v.y);});
    const pd=0.12,pl=new THREE.Mesh(new THREE.PlaneGeometry(b[0]-a[0]+2*pd,b[1]-a[1]+2*pd),new THREE.MeshBasicMaterial({color:d.color,transparent:true,opacity:0.1,side:THREE.DoubleSide,depthWrite:false}));
    pl.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,d.v.z);M.add(pl);});

    m.scale.set(rad,L,rad);m.position.copy(a).addScaledVector(d,0.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());M.add(m);});
  list.forEach(t=>{const n=t.n,col=new THREE.Color(t.color||'#e8eaec'),rr=t.depth===0?0.045:n.type==='إدارة'?0.036:(n.type==='موظف'||n.type==='قسم')?0.028:0.022;

    const body=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:done||prog?col:0xf4f6f7,roughness:0.45,transparent:prog,opacity:prog?0.6:1}));
    body.scale.setScalar(rr);body.position.copy(t.v);body.userData={id:n.id,r:rr};M.add(body);VR.picks.push(body);
    const sh=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:col,side:THREE.BackSide}));sh.scale.setScalar(1.22);body.add(sh);

    const lb=vrLabel(n.name||'…',t.depth<2);lb.position.copy(t.v).add(new THREE.Vector3(-(lb.scale.x/2+rr*1.2),rr*0.5+lb.userData.h/2,0));M.add(lb);});

function drawPanel(){const c=VR.pc,x=c.getContext('2d'),W=c.width,H=c.height;x.clearRect(0,0,W,H);x.fillStyle='rgba(22,28,33,0.95)';rrect(x,0,0,W,H,36);x.fill();

    T0([n.type,n.status||'جديدة',n.date].filter(Boolean).join(' · '),156,'34px '+FF,'#9aa2a9');

    row([['child','+ فرع'],['cont','+ متابعة'],['desel','رجوع']],350);}
  B('exit','خروج من VR',40,520,W-80,110,false);VR.ptex.needsUpdate=true;}
function vrHit(c){VR.tm.identity().extractRotation(c.matrixWorld);VR.rc.ray.origin.setFromMatrixPosition(c.matrixWorld);VR.rc.ray.direction.set(0,0,-1).applyMatrix4(VR.tm);
  const tg=VR.panel.parent===c?VR.picks:[VR.panel,...VR.picks];return VR.rc.intersectObjects(tg,false)[0]||null;}
function vrSelect(c){const h=vrHit(c);if(!h){sel=null;drawPanel();return;}
  if(h.object===VR.panel){if(!h.uv)return;const px=h.uv.x*VR.pc.width,py=(1-h.uv.y)*VR.pc.height;
    const b=VR.btns.find(b=>px>=b.bx&&px<=b.bx+b.bw&&py>=b.by&&py<=b.by+b.bh);if(b)vrAct(b.id);return;}
  sel=h.object.userData.id;drawPanel();}
function vrAct(id){
  if(id==='exit'){if(VR.session)VR.session.end();return;}
  if(id.startsWith('mode:')){mode=id.slice(5);document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===mode));layout();buildVR();drawPanel();return;}
  if(id==='desel'){sel=null;drawPanel();return;}
  const t=sel&&T[sel];if(!t)return;const n=t.n;
  if(id==='status'){snap();const st=['جديدة','قيد التنفيذ','مكتملة'];n.status=st[(st.indexOf(n.status||'جديدة')+1)%3];}
  else if(id==='color'){snap();const o=[...PAL,''],c=o[(o.indexOf(n.color||'')+1)%o.length];if(c)n.color=c;else delete n.color;}
  else if(id==='shape'){snap();const o=['circle','square','diamond'],c=o[(o.indexOf(n.shape||'circle')+1)%3];if(c==='circle')delete n.shape;else n.shape=c;}
  else if(id==='child'){snap();const ty=t.depth===0?'إدارة':n.type==='إدارة'?'موظف':n.type==='موظف'?'مهمة':n.type==='قسم'?'موظف':'خطوة';
    const nn={id:nid(),parent:n.id,name:'جديد',type:ty,status:'جديدة'};S.nodes.push(nn);sel=nn.id;}
  else if(id==='cont'){if(!t.par)return;snap();const nn={id:nid(),parent:t.par.n.id,name:'جديد',type:n.type,status:'جديدة',side:sideOf(t)};S.nodes.splice(S.nodes.indexOf(n)+1,0,nn);sel=nn.id;}
  else return;
  commit();buildVR();drawPanel();}
function vrFrame(){const dt=Math.min(0.05,VR.clock.getDelta()),xc=VR.r.xr.getCamera(),camP=new THREE.Vector3();xc.getWorldPosition(camP);
  if(VR.hover){VR.hover.scale.setScalar(VR.hover.userData.r);VR.hover=null;}
